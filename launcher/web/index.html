<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>mcbridge launcher</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">m</div>
      <div>
        <div class="title">mcbridge launcher</div>
        <div class="sub">离 线 安 装 与 启 动</div>
      </div>
    </div>
    <div class="modebar">
      <button id="modeInstall" class="on">可安装 <span id="cntInstall"></span></button>
      <button id="modeInstalled">已安装 <span id="cntInstalled"></span></button>
    </div>
    <input id="verSearch" class="search" placeholder="搜索版本号，例如 1.20 / fabric">
    <div class="verlist" id="verlist"></div>
    <div class="foot">仅单机 / 局域网 · 不打包游戏文件</div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="statusline">
        <span class="dot" id="dot"></span>
        <span id="statusText">未连接</span>
      </div>
      <div class="buttons">
        <button class="ghost" id="refresh">刷新列表</button>
        <button class="ghost" id="help" title="打开 docs/guide.md：安装、迁移、PCL 共用、FAQ">使用说明</button>
        <button class="ghost" id="openRoot" title="游戏根目录（libraries / assets / mods / saves 都在这里）">打开游戏目录</button>
        <button class="ghost" id="openMods" title="全局模组目录：其他启动器不开版本隔离时也读这里">打开 mods</button>
        <button class="ghost" id="openSaves" title="存档目录">打开存档</button>
      </div>
    </header>

    <section class="card hero">
      <div class="row">
        <select id="mcver" class="verpick"></select>
        <select id="loader">
          <option value="fabric">Fabric（推荐）</option>
          <option value="vanilla">原版</option>
          <option value="forge">Forge</option>
          <option value="neoforge">NeoForge</option>
        </select>
        <select id="loaderVer" title="加载器版本">
          <option value="">加载器：最新</option>
        </select>
        <button id="install" class="primary big">安装并启动</button>
      </div>
      <div class="row quick">
        <button class="chip" id="pickRelease">最新正式版</button>
        <button class="chip" id="pickSnapshot">最新快照</button>
        <label class="chk"><input type="checkbox" id="allsnap" checked> 含快照/远古</label>
        <span class="hint" id="vercount"></span>
      </div>
      <div class="hint">没装过会先自动下载安装，装完自动进游戏；已安装则直接启动。</div>
      <div class="progress"><div id="bar"></div></div>
      <div class="taskmsg" id="taskmsg">就绪</div>

      <details class="adv">
        <summary>高级设置</summary>
        <div class="row">
          <label>用户名</label>
          <input id="username" placeholder="Player">
          <label>内存</label>
          <input id="mem" class="narrow" placeholder="2G">
          <label class="chk"><input type="checkbox" id="allsnap" checked> 含快照/远古</label>
        </div>
        <div class="row">
          <label>游戏目录</label>
          <input id="root" class="grow" placeholder="留空则自动检测 .minecraft">
          <button class="ghost" id="save">保存</button>
        </div>
        <div class="row">
          <label>下载源</label>
          <select id="downloadSource">
            <option value="auto">自动（官方优先）</option>
            <option value="official">仅官方</option>
            <option value="mirror">镜像优先</option>
          </select>
          <span class="hint">镜像只替换验证过的路径；近期失败的源会自动靠后</span>
        </div>
        <div class="row">
          <label>整合包</label>
          <select id="mrpackPick" class="verpick"></select>
          <input id="mrpackPath" class="grow" placeholder="或粘贴 .mrpack 文件路径">
          <button class="ghost" id="mrpackInstall">安装整合包</button>
        </div>
        <div class="row">
          <label>模组</label>
          <select id="modPick" class="verpick"></select>
          <button class="ghost" id="modToggle">启用 / 禁用</button>
          <button class="ghost" id="modRefresh">刷新</button>
          <button class="ghost" id="modOpen">打开模组目录</button>
        </div>
        <div class="row">
          <label>兼容</label>
          <button class="ghost" id="syncProfiles" title="给每个已安装版本补 launcher_profiles.json 条目">让其他启动器识别</button>
          <span class="hint" id="compatHint">PCL/HMCL 直接把「游戏目录」指到本目录即可；版本隔离时模组放 versions/&lt;版本&gt;/mods</span>
        </div>
        <div class="row">
          <label>Java 运行时</label>
          <select id="jvmSelect" class="verpick"></select>
          <button class="ghost" id="jvmInstall">安装到游戏目录</button>
          <span class="hint" id="jvmStatus"></span>
        </div>
      </details>
    </section>

    <section class="card grow">
      <div class="row between">
        <div class="selinfo" id="selinfo">未选择版本</div>
        <button id="play" class="ghost" disabled>启动已选版本</button>
      </div>
      <pre class="console" id="console"></pre>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
