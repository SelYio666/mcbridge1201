name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The committed manifest must match the committed tree: 7e290e0 shipped doc
      # edits without refreshing runs/SHA256SUMS.txt and CI stayed green because
      # nothing verified it. Make that class of mistake fail loudly.
      - name: Hash manifest matches the checkout
        run: python tools/check_hashes.py

      # check_hashes only verifies what the manifest lists; a new run directory whose
      # README/result.json never got added would pass silently. This catches that.
      - name: Every run README/result is hashed
        run: python tools/check_manifest_coverage.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Java tests + CLI distribution
        run: gradle -p java --no-daemon test installDist

      - name: Python syntax
        run: |
          python -m py_compile \
            launcher/mclaunch.py launcher/backend.py launcher/server.py \
            tools/verify_evidence.py tools/check_hashes.py tools/hash_evidence.py \
            tools/audit_mixins.py tools/test_review_fixes.py tools/test_launcher_e2e.py \
            tools/build_bridges.py tools/rebuild_ironchests_client.py tools/build_portable.py \
            tools/bench_download.py tools/bench_segments.py tools/check_download_sources.py

      - name: JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node --check launcher/web/app.js
